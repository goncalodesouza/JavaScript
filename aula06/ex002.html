<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primeiro programa JS...</title>
    <style>
      body {
        color: darkred;
        background-color: rgb(90, 0, 0);
      }
    </style>
  </head>
  <body>
    <h1>Olá, Mundo!</h1>
    <script>
      var n1 = parseInt(prompt("Digite um número"));
      var n2 = parseInt(prompt("Digite outro número"));
      var soma = n1 + n2;
      alert("A soma dos valores é: " + String(soma));
    </script>
  </body>
</html>
