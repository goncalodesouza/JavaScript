<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="titulo">A minha primeira página dinâmica</h1>
    <p id="mensagem">Ainda não interagi com a página.</p>
    <div id="caixa">Caixa original</div>

    <script>
      var t = window.document.getElementById("titulo");
      t.innerHTML = "DOM em JavaScript";
      var m = window.document.getElementById("mensagem");
      m.innerText = "O conteúdo foi alterado com JavaScript!";
      var c = window.document.getElementById("caixa");
      c.style.color = "red";
    </script>
  </body>
</html>
