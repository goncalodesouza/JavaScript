<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificador de idade</title>
  </head>
  <body>
    <h1>Verificador de idade</h1>
    <input type="number" name="idade" id="idade" />
    <input type="button" value="Verificar" id="verificar" />
    <div id="res"></div>

    <script>
      var verif = window.document.querySelector("input#verificar");
      verif.addEventListener("click", v);
      function v() {
        var idd = window.document.getElementById("idade");
        idd = Number(idd.value);
        var r = window.document.getElementById("res");
        if (idd >= 18) {
          r.innerHTML = "És maior de idade.";
        } else {
          r.innerHTML = "És menor de idade.";
        }
      }
    </script>
  </body>
</html>
