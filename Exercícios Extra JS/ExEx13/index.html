<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var n1 = Number(prompt("Digite um número: "));
      var n2 = Number(prompt("Digite outro número: "));
      var soma = n1 + n2;
      var sub = n1 - n2;
      var mult = n1 * n2;
      var div = n1 / n2;
      var resto = n1 % n2;
      var pot = n1 ** n2;
      alert("A soma de " + n1 + " + " + n2 + " é: " + soma);
      alert("A subtração de " + n1 + " - " + n2 + " é: " + sub);
      alert("A multiplicação de " + n1 + " x " + n2 + " é: " + mult);
      alert("A divisão de " + n1 + " / " + n2 + " é: " + div);
      alert("O resto de " + n1 + " e " + n2 + " é: " + resto);
      alert("A potência de " + n1 + " elevado a " + n2 + " é: " + pot);
    </script>
  </body>
</html>
