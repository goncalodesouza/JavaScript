<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var n = Number(prompt("Digite um número: "));
      n += 5;
      n -= 2;
      n *= 3;
      n /= 2;
      n++;
      n--;
      ++n;
      --n;
      alert(n);
    </script>
  </body>
</html>
