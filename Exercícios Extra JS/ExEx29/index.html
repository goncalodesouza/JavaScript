<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classificação de jogador</title>
  </head>
  <body>
    <h1>Classificação de jogador</h1>
    <p>Escreva a idade do jogador:</p>
    <input type="number" name="idade" id="idade" />
    <input type="button" value="Enviar" id="botao" />
    <div id="res"></div>
    <script>
      var btn = window.document.getElementById("botao");
      btn.addEventListener("click", clicar);
      function clicar() {
        var i = Number(window.document.getElementById("idade").value);
        var r = window.document.getElementById("res");
        if (i < 6) {
          r.innerHTML = "Não elegível";
        } else {
          if (i >= 6 && i <= 11) {
            r.innerHTML = "Categoria infantil";
          } else if (i >= 12 && i <= 17) {
            r.innerHTML = "Categoria juvenil";
          } else {
            r.innerText = "Categoria sénior";
          }
        }
      }
    </script>
  </body>
</html>
