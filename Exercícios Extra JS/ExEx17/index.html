<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var idade = Number(prompt("Digite a sua idade: "));
      var dinheiro = Number(prompt("Digite o seu dinheiro: "));
      var maior10 = idade >= 18 && dinheiro >= 10;
      var menor20 = idade < 18 || dinheiro >= 20;
      var menor = idade < 18;
      alert(maior10);
      alert(menor20);
      alert(menor);
    </script>
  </body>
</html>
