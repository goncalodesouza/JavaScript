<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
      }
      #c {
        background-color: black;
        color: rgb(220, 220, 220);
        border: 3px solid rgb(220, 220, 220);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 0 20px 20px 20px;
        border-radius: 20px;
      }
      #contador {
        font-size: 2em;
        color: red;
        font-weight: bolder;
      }
      input {
        font-size: 1.2em;
        font-weight: bold;
        width: 120px;
        height: 40px;
        display: block;
        align-items: center;
        justify-content: center;
        background-color: black;
        border: 3px solid rgb(220, 220, 220);
        color: rgb(220, 220, 220);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="c">
      <h1>Contador de interações</h1>
      <div id="contador">0</div>
      <input type="button" value="Clica aqui" id="contar" />
      <input type="button" value="Reiniciar" id="reset" />
    </div>

    <script>
      var c = window.document.getElementById("contar");
      var cont = window.document.getElementById("contador");
      var n = 0;
      c.addEventListener("click", clicar);
      function clicar() {
        n++;
        cont.innerText = n;
        if (n > 10) cont.style.color = "green";
        else cont.style.color = "red";
      }
      var r = window.document.getElementById("reset");
      r.addEventListener("click", clica);
      function clica() {
        n = 0;
        cont.innerText = n;
        if (n > 10) cont.style.color = "green";
        else cont.style.color = "red";
      }
    </script>
  </body>
</html>
