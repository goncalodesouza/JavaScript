<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var n1 = Number(prompt("Digite um número: "));
      var n2 = Number(prompt("Digite outro número: "));
      var n3 = Number(prompt("Digite mais um número: "));
      var calc1 = n1 + n2 * n3;
      var calc2 = (n1 + n2) * n3;
      var calc3 = n1 ** 2 + n2 * n3;
      var calc4 = (n1 + n2 + n3) / 3;
      alert("O resultado de " + n1 + " + " + n2 + " x " + n3 + " = " + calc1);
      alert("O resultado de (" + n1 + " + " + n2 + ") x " + n3 + " = " + calc2);
      alert("O resultado de " + n1 + "² + " + n2 + " x " + n3 + " = " + calc3);
      alert(
        "O resultado de (" + n1 + " + " + n2 + " + " + n3 + ") / 3 = " + calc4,
      );
    </script>
  </body>
</html>
