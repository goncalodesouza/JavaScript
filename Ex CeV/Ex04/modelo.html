<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabuada</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Tabuada</h1>
    </header>
    <section>
      <div id="card">
        <label for="numero">Número a fazer a tabuada...</label>
        <input type="number" name="numero" id="numero" />
        <input type="button" value="Fazer tabuada" id="button" />
      </div>
      <div>
        <select
          name="tabuada"
          id="tabuada"
          size="10"
          style="font-size: 1.2em; width: 100%"
        ></select>
      </div>
    </section>
    <footer>
      <p>&copy; CursoemVídeo</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
