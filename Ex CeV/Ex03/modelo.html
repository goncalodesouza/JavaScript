<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super contador</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Vamos contar</h1>
    </header>
    <section>
      <div id="card">
        <label for="inicio">Introduz o valor de início...</label>
        <input type="number" name="inicio" id="inicio" />
        <label for="fim">Introduz o valor de fim...</label>
        <input type="number" name="fim" id="fim" />
        <label for="passo">Introduz o valor do passo...</label>
        <input type="number" name="passo" id="passo" />
        <input type="button" value="Contar" id="button" />
      </div>
      <div id="resultado">A preparar a contagem...</div>
    </section>
    <footer>
      <p>&copy; CursoemVídeo</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
